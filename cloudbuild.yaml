steps:
  # Create lowercase branch name for GCP labels (which require lowercase)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "${BRANCH_NAME,,}" > /workspace/branch_lower.txt
        cat /workspace/branch_lower.txt

  # Build the Docker image with buildkit for better caching
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/lad-backend:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/lad-backend:$SHORT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/lad-backend:$BRANCH_NAME',
      '-t', 'gcr.io/$PROJECT_ID/lad-backend:latest',
      '--cache-from', 'gcr.io/$PROJECT_ID/lad-backend:latest',
      '--build-arg', 'BUILDKIT_INLINE_CACHE=1',
      '.'
    ]

  # Push the Docker images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lad-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lad-backend:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lad-backend:$BRANCH_NAME']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lad-backend:latest']

  # Deploy to Cloud Run with automatic deployment for develop branch
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BRANCH_LOWER=$(cat /workspace/branch_lower.txt)
        gcloud run deploy $_SERVICE_NAME \
          --image gcr.io/$PROJECT_ID/lad-backend:$COMMIT_SHA \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --port 3004 \
          --memory 1Gi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 10 \
          --concurrency 80 \
          --timeout 300 \
          --set-secrets DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,OPENAI_API_KEY=openai-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,APOLLO_API_KEY=apollo-api-key:latest,UNIPILE_API_KEY=unipile-api-key:latest,UNIPILE_DSN=UNIPILE_DSN:latest,UNIPILE_TOKEN=UNIPILE_TOKEN:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,STRIPE_PUBLISHABLE_KEY=stripe-publishable-key:latest \
          --update-env-vars NODE_ENV=production,JWT_EXPIRES_IN=7d,BRANCH=$BRANCH_NAME,COMMIT_SHA=$SHORT_SHA,BUILD_ID=$BUILD_ID,FRONTEND_URL=$_FRONTEND_URL,BACKEND_URL=$_BACKEND_URL,BASE_URL=$_BASE_URL,BASE_URL_FRONTEND_HEADER=$_FRONTEND_HEADER,BASE_URL_FRONTEND_APIKEY=$_FRONTEND_APIKEY,DEFAULT_TENANT_ID=00000000-0000-0000-0000-000000000001,VAPI_API_KEY=e05f06b1-dd62-4d7d-bd57-af0089077d6e,VAPI_ASSISTANT_ID=77bf6217-7d09-4b1b-9d77-7c18aeba9330,VAPI_PHONE_NUMBER_ID=cdaed2ed-000b-4835-afb0-b2cebb3c532c,GCP_PROJECT_ID=$_GCP_PROJECT_ID,GCP_LOCATION=$_GCP_LOCATION,GCP_CLOUD_TASKS_SERVICE_ACCOUNT=cloud-tasks@salesmaya-pluto.iam.gserviceaccount.com,FOLLOWUP_QUEUE_NAME=$_FOLLOWUP_QUEUE_NAME,FOLLOWUP_EXECUTION_ENDPOINT=$_FOLLOWUP_EXECUTION_ENDPOINT,DEFAULT_FOLLOW_UP_AGENT_ID=$_DEFAULT_FOLLOW_UP_AGENT_ID,STRIPE_SUCCESS_URL=$_STRIPE_SUCCESS_URL,STRIPE_CANCEL_URL=$_STRIPE_CANCEL_URL \
          --update-labels branch=$${BRANCH_LOWER},commit-sha=$SHORT_SHA,managed-by=cloud-build

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/lad-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lad-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/lad-backend:$BRANCH_NAME'
  - 'gcr.io/$PROJECT_ID/lad-backend:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: 'ALLOW_LOOSE'
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

# Timeout for the entire build
timeout: '1200s'

# Substitutions (automatically provided by Cloud Build trigger)
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'lad-backend-develop'
  _ENV: 'develop'
