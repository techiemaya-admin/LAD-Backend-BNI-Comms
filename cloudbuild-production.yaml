steps:
  # Step 1: Build Docker image for production
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lad-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lad-backend:$BRANCH_NAME'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lad-backend:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/lad-backend:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: 'build'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lad-backend:$COMMIT_SHA'
    id: 'push-sha'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lad-backend:latest'
    id: 'push-latest'

  # Step 3: Deploy to Cloud Run (production)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lad-backend'
      - '--image=gcr.io/$PROJECT_ID/lad-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3004'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=20'
      - '--concurrency=80'
      - '--timeout=300'
      - '--cpu-boost'
      - '--set-env-vars=NODE_ENV=production,JWT_EXPIRES_IN=7d,BRANCH=$BRANCH_NAME,COMMIT_SHA=$COMMIT_SHA,CORS_ORIGINS=https://lad-frontend-741719885039.us-central1.run.app;https://www.mrlads.com;https://app.mrlads.com,FRONTEND_URL=https://lad-frontend-741719885039.us-central1.run.app,BACKEND_URL=https://lad-backend-741719885039.us-central1.run.app,BASE_URL=https://voag.techiemaya.com,BASE_URL_FRONTEND_HEADER=settings,BASE_URL_FRONTEND_APIKEY=_L5cf6UXDkGTcWRaHka9Q13Kmu4k5dxaKEPRH165U8U,DEFAULT_TENANT_ID=00000000-0000-0000-0000-000000000001,GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=us-central1,FOLLOWUP_QUEUE_NAME=follow-up-voag-calls-v2,FOLLOWUP_EXECUTION_ENDPOINT=https://lad-backend-741719885039.us-central1.run.app/api/deal-pipeline/bookings,DEFAULT_FOLLOW_UP_AGENT_ID=24,APOLLO_WEBHOOK_URL=https://apollo-phone-service-741719885039.us-central1.run.app/api/webhook/apollo-phone,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CLOUD_TASKS_LOCATION=us-central1,CLOUD_TASKS_QUEUE_NAME=campaign-scheduler-task-prod,CLOUD_RUN_SERVICE_URL=https://lad-backend-741719885039.us-central1.run.app'
      - '--set-secrets=DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,OPENAI_API_KEY=openai-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,APOLLO_API_KEY=apollo-api-key:latest,UNIPILE_API_KEY=unipile-api-key:latest,UNIPILE_DSN=UNIPILE_DSN:latest,UNIPILE_TOKEN=UNIPILE_TOKEN:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest'
      - '--service-account=$PROJECT_ID-deploy@$PROJECT_ID.iam.gserviceaccount.com'
    id: 'deploy'

# Build configuration
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  sourceProvenanceHash:
    - SHA256

# Images to push to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/lad-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lad-backend:latest'

# Timeout
timeout: 1800s

# Substitutions
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'lad-backend'

# Trigger configuration (applied in Cloud Console)
# Trigger on: Push to main branch
# Branch: ^main$
# Require approval before build: ON
